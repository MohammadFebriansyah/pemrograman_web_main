<!DOCTYPE html>
<html>
  <head>
    <title>Profile Saya</title>
    <style>
      body {
        background-color: #f5f5f5;
        /* jarak luar */
        margin: 0;
        /* jarak dalam */
        padding: 0;
        box-sizing: border-box;
        font-family: Arial, Helvetica, sans-serif;
        height: 100vh;
        display: flex;
        flex-direction: column;
      }
      .navigasi {
        background-color: #132440;
        color: white;
        /* atur posisi */
        display: flex;
        flex-direction: row;
        /* jarak horizontal */
        justify-content: space-between;
        /* jark vertikal */
        align-items: center;
        /* jarak dalam navbar vertical horizontal */
        padding: 10px 20px;
        /* posisi navbar */
        position: sticky;
        top: 0;
        left: 0;
        right: 0;
        z-index: 99;
      }

      .navigasi a {
        text-decoration: none;
        color: white;
      }
      .main {
        display: flex;
        justify-content: center;
        align-items: center;
        /* tinggi elemen */
        height: 100vh;
      }
      .card {
        background-color: white;
        width: 40%;
        height: 80%;
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        border: 2px solid #132440;
        border-radius: 5px;
        padding: 20px;
        line-height: 0%;
      }
      footer {
        background-color: #132440;
        color: white;
        text-align: center;
        padding: 20px;
      }
      p {
        font-weight: bold;
      }
    </style>
  </head>
  <body>
    <header class="navigasi">
      <h1>Profile Saya</h1>
      <a href="index.html">Blog Saya</a>
    </header>
    <div class="main">
      <div class="card">
        <img class="foto" src="profile.jpeg" width="150px" alt="img" />
        <p>Mohammad Febriansyah</p>
        <p>244107060117</p>
        <p>DIV-Sistem Informasi Bisnis</p>
        <p>Politeknik Negeri Malang</p>
      </div>
    </div>
    <footer>
      <p>&copy; 2025 Mohammad Febriansyah</p>
    </footer>
    <script src="jquery.min.js"></script>
    <script>
      $(document).ready(function () {
        $(".card").hide().fadeIn(1300);
        $(".card p")
          .hide()
          .each(function (index) {
            $(this)
              .delay(300 * index)
              .slideDown(500);
          });
      });
    </script>
  </body>
</html>
